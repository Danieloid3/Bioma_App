[project]
name = "bioma-api"
version = "0.1.0"
description = "Bioma API with Clean Architecture and PostgreSQL-enforced security"
requires-python = ">=3.12,<3.15"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "bcrypt>=4.2,<6.0",
  "fastapi>=0.115,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT>=2.10,<3.0",
  "redis[hiredis]>=5.2,<7.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["database*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE002"]

