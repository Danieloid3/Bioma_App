name: bioma-frontend

services:
  web:
    image: bioma-frontend-web:dev
    build:
      context: .
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${WEB_PORT:-5174}:5173"
    volumes:
      - ./:/app
      - bioma_frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]

volumes:
  bioma_frontend_node_modules:

