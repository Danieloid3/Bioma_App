name: bioma

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - bioma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - bioma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrator:
    image: postgres:16-bookworm
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BIO_APP_DB_PASSWORD: ${BIO_APP_DB_PASSWORD}
    volumes:
      - ./database:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/migrations/run-migrations.sh"]
    restart: "no"

  api:
    image: bioma-local-api:dev
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${BIO_APP_DB_USER}:${BIO_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-bioma_refresh_token}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_LOGIN_IP: ${RATE_LIMIT_LOGIN_IP:-20}
      RATE_LIMIT_LOGIN_ACCOUNT: ${RATE_LIMIT_LOGIN_ACCOUNT:-10}
      RATE_LIMIT_COPILOT: ${RATE_LIMIT_COPILOT:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BIO_LLM_PROVIDER: ${BIO_LLM_PROVIDER:-openai}
      BIO_LLM_MODEL: ${BIO_LLM_MODEL:-gpt-5.6-terra}
      BIO_EMBEDDING_MODEL: ${BIO_EMBEDDING_MODEL:-text-embedding-3-small}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    image: bioma-local-web:dev
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${WEB_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]

  database-tests:
    image: postgres:16-bookworm
    profiles: ["test"]
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_APP_URL: postgresql://${BIO_APP_DB_USER}:${BIO_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./database:/migrations:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    command: ["sh", "/migrations/tests/run-security-tests.sh"]

  embedding-worker:
    image: bioma-local-api:dev
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${BIO_APP_DB_USER}:${BIO_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BIO_LLM_PROVIDER: ${BIO_LLM_PROVIDER:-openai}
      BIO_LLM_MODEL: ${BIO_LLM_MODEL:-gpt-5.6-terra}
      BIO_EMBEDDING_MODEL: ${BIO_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_WORKER_POLL_SECONDS: ${EMBEDDING_WORKER_POLL_SECONDS:-5}
    volumes:
      - ./backend:/app
    depends_on:
      migrator:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.embeddings"]

volumes:
  bioma_postgres_data:
  bioma_redis_data:
  frontend_node_modules:
